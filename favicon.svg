<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D3206"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>

  <!-- Yin-Yang base: top half white, bottom half black -->
  <clipPath id="clip">
    <circle cx="32" cy="32" r="18"/>
  </clipPath>
  <circle cx="32" cy="32" r="18" fill="#F5E6C8" clip-path="url(#clip)"/>
  <path d="M32 14 A18 18 0 0 1 32 50 A9 9 0 0 1 32 32 A9 9 0 0 0 32 14 Z" fill="#2A1A0E"/>

  <!-- Small circles -->
  <circle cx="32" cy="23" r="4.5" fill="#2A1A0E"/>
  <circle cx="32" cy="41" r="4.5" fill="#F5E6C8"/>

  <!-- Outer ring accent -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F5E6C8" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- 4 star dots at corners -->
  <circle cx="32" cy="8"  r="2" fill="#FFD700"/>
  <circle cx="56" cy="32" r="2" fill="#FFD700"/>
  <circle cx="32" cy="56" r="2" fill="#FFD700"/>
  <circle cx="8"  cy="32" r="2" fill="#FFD700"/>
</svg>
