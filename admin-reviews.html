<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>후기 관리자 — 천지인 사주</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#0f1216;color:#d8dee5;margin:0;padding:24px;line-height:1.6}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:1.3rem;margin:0 0 16px;color:#d4af37}
  .config{background:#1b1f25;border:1px solid #2a313a;border-radius:10px;padding:16px;margin-bottom:18px}
  .config label{display:block;font-size:.78rem;color:#9aa3b1;margin-bottom:6px}
  .config input{width:100%;box-sizing:border-box;background:#0c0f12;border:1px solid #2a313a;color:#d8dee5;padding:9px 12px;border-radius:6px;font-family:inherit;font-size:.86rem}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .row button{flex:1;min-width:120px;background:#d4af37;color:#1b1f25;border:0;padding:10px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit}
  .row button.secondary{background:#2a313a;color:#d8dee5}
  .row button:disabled{opacity:.4;cursor:not-allowed}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{background:#1b1f25;color:#9aa3b1;border:1px solid #2a313a;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.82rem}
  .tabs button.on{background:#d4af37;color:#1b1f25;border-color:#d4af37;font-weight:700}
  .review{background:#1b1f25;border:1px solid #2a313a;border-radius:10px;padding:16px;margin-bottom:12px}
  .review header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;flex-wrap:wrap}
  .stars{color:#f5d76e;letter-spacing:2px}
  .cat-tag{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:50px;background:rgba(212,175,55,.15);color:#d4af37}
  .meta{font-size:.7rem;color:#6b7280;line-height:1.7}
  .body{font-size:.86rem;color:#d8dee5;margin:8px 0;padding:10px;background:#0c0f12;border-radius:6px;white-space:pre-wrap;word-break:keep-all}
  .ops{display:flex;gap:8px;flex-wrap:wrap}
  .ops button{font-family:inherit;font-size:.74rem;padding:6px 12px;border:0;border-radius:5px;cursor:pointer}
  .ops .copy{background:#3a8a5c;color:#fff}
  .ops .block{background:#a4453b;color:#fff}
  .status{font-size:.78rem;color:#9aa3b1;margin:10px 0}
  .err{color:#ff8888}
  pre{background:#0c0f12;padding:10px;border-radius:6px;overflow-x:auto;font-size:.72rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>💝 후기 관리자 — 천지인 사주</h1>

  <div class="config">
    <label>Worker Base URL (예: <code>https://kakao-payment.your-subdomain.workers.dev</code>)</label>
    <input id="cfgBase" placeholder="https://..." autocomplete="off">
    <label style="margin-top:10px">Admin Token</label>
    <input id="cfgToken" type="password" placeholder="ADMIN_TOKEN 시크릿 값" autocomplete="off">
    <div class="row">
      <button onclick="saveCfg()">설정 저장</button>
      <button class="secondary" onclick="clearCfg()">초기화</button>
    </div>
  </div>

  <div class="tabs">
    <button id="tabPending" class="on" onclick="load('pending')">대기 (pending)</button>
    <button id="tabApproved" onclick="load('approved')">승인 (approved)</button>
    <button id="tabRejected" onclick="load('rejected')">거절 (rejected)</button>
  </div>

  <div class="status" id="status">설정을 입력하고 탭을 클릭하세요.</div>
  <div id="list"></div>
</div>

<script>
const CFG_KEY='admin_reviews_cfg_v1';
function loadCfg(){
  try{const r=localStorage.getItem(CFG_KEY);if(r){const c=JSON.parse(r);document.getElementById('cfgBase').value=c.base||'';document.getElementById('cfgToken').value=c.token||'';}}catch(e){}
}
function saveCfg(){
  const base=document.getElementById('cfgBase').value.trim().replace(/\/$/,'');
  const token=document.getElementById('cfgToken').value.trim();
  if(!base||!token){alert('Worker URL과 Admin Token을 모두 입력해 주세요.');return;}
  localStorage.setItem(CFG_KEY,JSON.stringify({base,token}));
  document.getElementById('status').textContent='설정 저장됨. 탭을 클릭해 조회하세요.';
}
function clearCfg(){
  localStorage.removeItem(CFG_KEY);
  document.getElementById('cfgBase').value='';
  document.getElementById('cfgToken').value='';
  document.getElementById('status').textContent='설정 초기화됨.';
}
function getCfg(){
  try{const r=localStorage.getItem(CFG_KEY);return r?JSON.parse(r):null;}catch(e){return null;}
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function fmtDate(ts){try{return new Date(ts).toLocaleString('ko-KR');}catch(e){return ts;}}
async function load(status){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab'+status[0].toUpperCase()+status.slice(1)).classList.add('on');
  const cfg=getCfg();
  if(!cfg){document.getElementById('status').textContent='먼저 설정을 입력하고 저장하세요.';return;}
  document.getElementById('status').textContent='조회 중…';
  document.getElementById('list').innerHTML='';
  try{
    const res=await fetch(`${cfg.base}/admin/reviews?status=${status}&token=${encodeURIComponent(cfg.token)}`);
    const data=await res.json();
    if(!data.ok){document.getElementById('status').innerHTML=`<span class="err">조회 실패: ${escapeHtml(data.code||'')} ${escapeHtml(data.message||'')}</span>`;return;}
    document.getElementById('status').textContent=`${status}: ${data.items.length}건${data.cursor?' (더 있음)':''}`;
    const list=document.getElementById('list');
    if(data.items.length===0){list.innerHTML='<div class="review" style="color:#6b7280">표시할 후기가 없습니다.</div>';return;}
    list.innerHTML=data.items.map(r=>{
      const stars='★'.repeat(r.stars||0)+'☆'.repeat(5-(r.stars||0));
      const reviewObj={stars:r.stars,cat:catLabel(r.cat),text:r.text,name:r.nickname,date:fmtDateShort(r.createdAt)};
      const reviewJson=JSON.stringify(reviewObj).replace(/'/g,"\\'");
      return `
      <article class="review">
        <header>
          <div><span class="stars">${stars}</span> <span class="cat-tag">${escapeHtml(catLabel(r.cat))}</span></div>
          <div class="meta">${escapeHtml(r.nickname||'')} · ${fmtDate(r.createdAt)}</div>
        </header>
        <div class="body">${escapeHtml(r.text||'')}</div>
        <div class="meta" style="margin-bottom:8px">
          sajuId: <code>${escapeHtml(r.sajuId)}</code> · userId: <code>${escapeHtml(r.partnerUserId||'')}</code> · ip: <code>${escapeHtml(r.ip||'-')}</code>
        </div>
        <div class="ops">
          <button class="copy" onclick='copyJson(${JSON.stringify(reviewJson)})'>📋 REVIEWS 배열용 JSON 복사</button>
          <button class="block" onclick="blockSaju('${escapeHtml(r.sajuId)}')">🚫 이 사주 차단</button>
        </div>
      </article>`;
    }).join('');
  }catch(e){
    document.getElementById('status').innerHTML=`<span class="err">네트워크 오류: ${escapeHtml(e.message||'')}</span>`;
  }
}
function catLabel(cat){
  const M={daypick:'지정일 운세',monthly:'월별 운세',newyear:'신년운세',gunghap:'궁합',name:'작명',life:'인생총운',chatpack1:'추가 질문',chatpack3:'추가 질문',chatpack5:'추가 질문',chatpack10:'추가 질문'};
  return M[cat]||cat;
}
function fmtDateShort(ts){try{const d=new Date(ts);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}catch(e){return '';}}
function copyJson(j){
  navigator.clipboard.writeText(j).then(()=>alert('JSON이 복사되었습니다. index.html의 REVIEWS 배열에 붙여넣으세요.'));
}
function blockSaju(sid){
  alert(`차단 명령:\nwrangler kv:key put --binding REVIEWS_KV "review_blocked:${sid}" "1" --config wrangler.kakao-payment.toml\n\n위 명령을 터미널에서 실행하세요.`);
}
loadCfg();
</script>
</body>
</html>
