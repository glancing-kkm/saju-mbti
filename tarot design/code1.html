<script>
        function selectSpread(id) {
            // Update UI list items
            document.querySelectorAll('[data-spread-id]').forEach(card => {
                const spreadId = card.getAttribute('data-spread-id');
                if (spreadId === id) {
                    card.classList.add('glowing-border', 'bg-midnight-purple/10');
                    const badge = card.querySelector('.absolute');
                    if(badge) badge.style.display = 'block';
                    const iconBox = card.querySelector('.w-12');
                    if(iconBox) iconBox.classList.replace('border-celestial-gold/20', 'border-celestial-gold');
                    if(iconBox) iconBox.classList.replace('bg-midnight-purple', 'bg-secondary-container/40');
                } else {
                    card.classList.remove('glowing-border', 'bg-midnight-purple/10');
                    const badge = card.querySelector('.absolute');
                    if(badge) badge.style.display = 'none';
                    const iconBox = card.querySelector('.w-12');
                    if(iconBox) iconBox.classList.replace('border-celestial-gold', 'border-celestial-gold/20');
                    if(iconBox) iconBox.classList.replace('bg-secondary-container/40', 'bg-midnight-purple');
                }
            });

            // Update Spread Preview Layout
            document.getElementById('layout-3').classList.add('hidden');
            document.getElementById('layout-5').classList.add('hidden');
            document.getElementById('layout-10').classList.add('hidden');
            
            const selectedLayout = document.getElementById('layout-' + id);
            selectedLayout.classList.remove('hidden');</script></body></html>
