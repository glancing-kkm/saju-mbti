<main class="flex-1 pt-20 flex flex-col overflow-hidden">
    <!-- Top Section: 5-Card Cross-->
    <section class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="spread-container">

                <span class="text-celestial-gold/30 font-garamond text-xl">1</span>
            </div>
            <div class="card-slot slot-2" data-slot="2">

    <section class="h-[350px] flex flex-col justify-end pb-12">
        <div class="carousel-outer flex" id="fan-scroll">
            <div class="fan-track flex justify-center items-end px-4 h-[280px] w-full" id="card-track"><div class="fan-card" style="transform: rotate(-21deg) translateY(16.8px);"></div><div class="fan-card" style="transform: rotate(-18deg) translateY(14.4px);"></div><div class="fan-card" style="transform: rotate(-15deg) translateY(12px);"></div><div class="fan-card" style="transform: rotate(-12deg) translateY(9.6px);"></div><div class="fan-card" style="transform: rotate(-9deg) translateY(7.2px);"></div><div class="fan-card" style="transform: rotate(-6deg) translateY(4.8px);"></div><div class="fan-card" style="transform: rotate(-3deg) translateY(2.4px);"></div><div class="fan-card focused drop-shadow-[0_0_15px_rgba(212,175,55,0.6)]" style="transform: translateY(-50px) scale(1.8);"></div><div class="fan-card" style="transform: rotate(3deg) translateY(2.4px);"></div><div class="fan-card" style="transform: rotate(6deg) translateY(4.8px);"></div><div class="fan-card" style="transform: rotate(9deg) translateY(7.2px);"></div><div class="fan-card" style="transform: rotate(12deg) translateY(9.6px);"></div><div class="fan-card" style="transform: rotate(15deg) translateY(12px);"></div><div class="fan-card" style="transform: rotate(18deg) translateY(14.4px);"></div><div class="fan-card" style="transform: rotate(21deg) translateY(16.8px);"></div></div>
        </div>

        <!-- Completion Button -->
        <div class="flex justify-center mt-6 h-12">
            <button id="btn-complete" class="hidden px-12 py-3 btn-gold rounded-full font-bold text-sm transition-all transform hover:scale-105 active:scale-95 animate-pulse">
                선택 완료
            </button>
        </div>
    </section>
</main>

<script>
    const cardTrack = document.getElementById('card-track');
    const scrollContainer = document.getElementById('fan-scroll');
    const totalCards = 78;
    let selectedCount = 0;

    // Create 78 cards in an arched fan
    for (let i = 0; i < totalCards; i++) {
        const card = document.createElement('div');
        card.className = 'fan-card';
        
        // Arch calculation
        const offset = i - (totalCards / 2);
        const rotation = offset * 1.5; // Fan spread angle
        const yPos = Math.abs(offset) * 1.2; // Arc height
        
        card.style.transform = `rotate(${rotation}deg) translateY(${yPos}px)`;
        
        card.addEventListener('click', () => handleCardSelection(card));
        cardTrack.appendChild(card);
    }

    // Scroll listener for focus effect
    scrollContainer.addEventListener('scroll', () => {
        const cards = document.querySelectorAll('.fan-card');
        const centerX = window.innerWidth / 2;
        
        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const cardCenter = rect.left + rect.width / 2;
            const distance = Math.abs(centerX - cardCenter);
            
            if (distance < 25) {
                card.classList.add('focused');
            } else {
                card.classList.remove('focused');
            }
        });
    });

    // Initial center scroll
    setTimeout(() => {
        scrollContainer.scrollLeft = (scrollContainer.scrollWidth - window.innerWidth) / 2;
    }, 100);

    function handleCardSelection(card) {
        if (selectedCount >= 5 || card.classList.contains('used')) return;

        selectedCount++;
        card.classList.add('used');
        card.style.opacity = '0.3';
        card.style.pointerEvents = 'none';

        const slots = document.querySelectorAll('.card-slot');
        const currentSlot = Array.from(slots).find(s => !s.classList.contains('filled'));
        
        if (currentSlot) {
            currentSlot.classList.add('filled');
            currentSlot.innerHTML = `<div class="w-full h-full card-back-pattern rounded shadow-lg"></div>`;
            currentSlot.classList.remove('</script></body></html>
